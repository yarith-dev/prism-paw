<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prism Paw — Voxel Preview</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: linear-gradient(180deg, #24185a 0%, #6b2f9e 45%, #e0569f 75%, #ffb36b 100%); font-family: system-ui, sans-serif; }
  canvas { display: block; }
  #label { position: fixed; left: 16px; bottom: 14px; color: #fff; opacity: .85; font-size: 13px; letter-spacing: .04em; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="label">PRISM PAW · voxel style test · drag to orbit</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- tiny voxel modelling kit ----------
const GLOW = new Set();
function model() {
  const m = new Map();
  const api = {
    m,
    set(x, y, z, c) { m.set(`${x},${y},${z}`, c); return api; },
    del(x, y, z) { m.delete(`${x},${y},${z}`); return api; },
    box(x0, y0, z0, x1, y1, z1, c) {
      for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) for (let z = z0; z <= z1; z++) api.set(x, y, z, c);
      return api;
    },
  };
  return api;
}

function build(mdl, ox = 0, oy = 0, oz = 0) {
  const group = new THREE.Group();
  const solid = [], glow = [];
  for (const [k, c] of mdl.m) (GLOW.has(c) ? glow : solid).push([k.split(',').map(Number), c]);
  const geo = new THREE.BoxGeometry(1, 1, 1);
  const make = (list, mat) => {
    const mesh = new THREE.InstancedMesh(geo, mat, list.length);
    const mtx = new THREE.Matrix4(), col = new THREE.Color();
    list.forEach(([[x, y, z], c], i) => {
      mtx.makeTranslation(x + ox, y + oy + 0.5, z + oz);
      mesh.setMatrixAt(i, mtx);
      mesh.setColorAt(i, col.set(c));
    });
    mesh.castShadow = mesh.receiveShadow = true;
    group.add(mesh);
  };
  make(solid, new THREE.MeshStandardMaterial({ roughness: 0.75, metalness: 0.05 }));
  if (glow.length) make(glow, new THREE.MeshBasicMaterial());
  return group;
}

// ---------- Nova: two-legged ginger tabby courier with a Prism Blaster ----------
const C = {
  fur: '#f28c28', furDark: '#c45d16', white: '#fff4e6', pink: '#ff8fb1',
  jacket: '#6a4ce4', jacketDark: '#4b34b3', trim: '#ffd23f', boot: '#28244c',
  eye: '#1c1a33', iris: '#3be08f', goggle: '#3a3f5c', strap: '#8a5a3b',
  gun: '#454c63', gunDark: '#2a2f40',
  lens: '#62f4ff', glowPink: '#ff4fd8', barrel: '#7dfcff',
};
GLOW.add(C.lens).add(C.glowPink).add(C.barrel);

function nova() {
  const n = model();
  // boots and legs
  n.box(-3, 0, -1, -1, 1, 2, C.boot).box(1, 0, -1, 3, 1, 2, C.boot);
  n.box(-3, 2, -1, -1, 5, 1, C.fur).box(1, 2, -1, 3, 5, 1, C.fur);
  // torso: open courier jacket over a white chest, neon trim, bag strap
  n.box(-4, 6, -2, 4, 13, 2, C.jacket);
  n.box(-4, 6, -2, 4, 6, 2, C.trim);
  n.box(-1, 7, 2, 1, 12, 2, C.white);
  n.box(-2, 7, 2, -2, 12, 2, C.jacketDark).box(2, 7, 2, 2, 12, 2, C.jacketDark);
  for (let i = 0; i <= 8; i++) n.set(-4 + i, 13 - i, 2, C.strap);
  n.box(-4, 11, -2, -3, 12, -2, C.pink); // shoulder patch on the back
  // left arm hanging, right arm holding the blaster
  n.box(-6, 9, -1, -5, 13, 1, C.jacket).box(-6, 9, -1, -5, 9, 1, C.trim).box(-6, 7, -1, -5, 8, 1, C.fur);
  n.box(5, 9, -1, 6, 13, 1, C.jacket).box(5, 9, -1, 6, 9, 1, C.trim).box(5, 7, 0, 6, 8, 2, C.fur);
  // Prism Blaster
  n.box(6, 6, 1, 7, 7, 2, C.gunDark);
  n.box(6, 8, -1, 8, 10, 6, C.gun);
  n.box(8, 9, 0, 8, 9, 5, C.glowPink);
  n.box(6, 11, 1, 7, 11, 3, C.lens);
  n.box(6, 9, 7, 8, 9, 8, C.barrel).set(7, 8, 7, C.gunDark).set(7, 10, 7, C.gunDark);
  n.set(5, 8, 2, C.fur);
  // big head
  n.box(-6, 14, -5, 6, 23, 5, C.fur);
  n.box(-2, 14, 6, 2, 16, 6, C.white);                       // muzzle
  n.box(-5, 14, 5, -3, 15, 5, C.white).box(3, 14, 5, 5, 15, 5, C.white);
  n.set(0, 16, 6, C.pink).set(0, 15, 6, C.eye).set(-1, 14, 6, C.eye).set(1, 14, 6, C.eye);
  for (const ex of [-4, 4]) {                                 // eyes
    n.box(ex - 1, 17, 5, ex + 1, 19, 5, C.iris).box(ex, 17, 5, ex, 19, 5, C.eye).set(ex - 1, 19, 5, C.white);
  }
  n.set(-1, 20, 5, C.furDark).set(1, 20, 5, C.furDark).set(0, 20, 5, C.fur);
  // goggles pushed up on the forehead
  n.box(-6, 21, -5, 6, 22, 5, C.goggle);
  n.box(-5, 21, 6, -2, 22, 6, C.lens).box(2, 21, 6, 5, 22, 6, C.lens).box(-1, 21, 6, 1, 21, 6, C.goggle);
  // tabby stripes
  for (const x of [-3, 0, 3]) n.box(x, 23, -4, x, 23, 4, C.furDark);
  for (const s of [-6, 6]) n.box(s, 18, -3, s, 18, 1, C.furDark).box(s, 16, -2, s, 16, 0, C.furDark).box(s, 20, -4, s, 20, -1, C.furDark);
  // whiskers
  for (const s of [-1, 1]) n.set(7 * s, 16, 4, C.white).set(7 * s, 14, 4, C.white);
  // ears (right one notched)
  for (const s of [-1, 1]) {
    for (let k = 0; k < 4; k++) n.box(Math.min(s * 6, s * (3 + k)), 24 + k, -1, Math.max(s * 6, s * (3 + k)), 24 + k, 1, C.fur);
    n.set(5 * s, 24, 1, C.pink).set(4 * s, 24, 1, C.pink).set(5 * s, 25, 1, C.pink);
  }
  n.del(6, 27, -1).del(6, 27, 0).del(6, 27, 1).del(5, 26, 0).del(5, 26, 1).del(5, 26, -1);
  // striped tail curling up behind
  const tail = [[7, -3], [7, -4], [8, -5], [9, -6], [10, -6], [11, -6], [12, -6], [13, -5], [14, -5], [15, -4]];
  tail.forEach(([y, z], i) => n.box(-1, y, z, 0, y, z, i >= tail.length - 2 ? C.white : (i >> 1) % 2 ? C.furDark : C.fur));
  return n;
}

// ---------- Drab: a Greyscale harvester robot ----------
const G = { body: '#8d939c', light: '#b9bec6', dark: '#4f545d', eye: '#f4f7ff' };
GLOW.add(G.eye);
function drab() {
  const d = model();
  d.box(-2, 0, -1, -1, 0, 1, G.dark).box(1, 0, -1, 2, 0, 1, G.dark);
  d.box(-3, 1, -3, 3, 8, 3, G.body);
  for (const x of [-3, 3]) for (const z of [-3, 3]) d.box(x, 1, z, x, 8, z, G.dark);
  d.box(-3, 4, -3, 3, 4, 3, G.dark);
  d.box(-2, 9, -2, 2, 9, 2, G.light).box(-1, 10, -1, 1, 10, 1, G.light);
  d.box(-2, 5, 3, 2, 7, 3, G.dark).box(-1, 5, 4, 1, 7, 4, G.eye).set(0, 6, 4, G.dark);
  d.set(0, 11, 0, G.dark).set(0, 12, 0, G.dark).set(0, 13, 0, G.eye);
  // vacuum hose and nozzle
  [[4, 6, 0], [5, 6, 1], [5, 5, 2], [6, 4, 3], [6, 3, 4]].forEach(([x, y, z]) => d.set(x, y, z, G.dark));
  d.box(5, 1, 4, 7, 2, 6, G.dark).box(5, 1, 7, 7, 1, 7, G.light);
  return d;
}

// ---------- ground: colorful Kittara tiles meet grey Greyscale tiles ----------
function ground() {
  const g = model();
  const bright = ['#ff7eb6', '#7ef0c8', '#ffe066', '#8fb8ff'];
  const grey = ['#9aa0a8', '#80868f'];
  for (let x = -14; x <= 30; x++) for (let z = -8; z <= 8; z++) {
    const tx = Math.floor((x + 14) / 3), tz = Math.floor((z + 8) / 3);
    const greyed = x > 9 + Math.round(Math.sin(z * 0.9) * 2);
    g.set(x, -1, z, greyed ? grey[(tx + tz) % 2] : bright[(tx + tz * 3) % 4]);
    g.set(x, -2, z, greyed ? '#5d626a' : '#5a3fb8');
  }
  return g;
}

// ---------- scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 1, 500);
camera.position.set(-14, 58, 78);

scene.add(new THREE.HemisphereLight('#ffd6f5', '#3a2a7a', 1.4));
const sun = new THREE.DirectionalLight('#fff1d6', 2.2);
sun.position.set(-20, 40, 30);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40 });
scene.add(sun);
const rim = new THREE.DirectionalLight('#62f4ff', 1.0);
rim.position.set(20, 20, -30);
scene.add(rim);

const world = new THREE.Group();
scene.add(world);
const novaMesh = build(nova(), 0, 0, 0);
const drabModel = drab();
const drabs = [[16, -5], [24, 5], [25, -6], [17, 6]].map(([x, z], i) => {
  const d = build(drabModel);
  d.position.set(x, 0, z);
  d.rotation.y = Math.atan2(-x, -z) ;
  d.userData.phase = i * 1.3;
  return d;
});
novaMesh.rotation.y = 0.95;
world.add(build(ground()), novaMesh, ...drabs);
world.position.x = -8;

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 4, 0);
controls.enableDamping = true;


addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  novaMesh.position.y = Math.abs(Math.sin(t * 2.2)) * 0.6;
  for (const d of drabs) d.position.y = Math.sin(t * 3 + d.userData.phase) * 0.25 + 0.25;
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
